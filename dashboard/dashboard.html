<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | AVA-EDUCA+</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="cabecalho">
    <strong class="marca">AVA-EDUCA+</strong>
    <span id="nomeUsuario"></span>
  </header>
  <div class="layout">
    <nav class="menu" aria-label="Menu principal">
      <button id="btnDashboard" class="ativo">Dashboard</button>
      <button id="btnCursos" disabled>Cursos</button>
      <button id="btnCadastro">Cadastro de Alunos</button>
      <button id="btnSair">Sair</button>
    </nav>
    <main>
      <h1>Meus cursos</h1>
      <section id="listaCursos" class="grade-cards" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
